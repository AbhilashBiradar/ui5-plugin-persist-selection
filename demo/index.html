<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PersistSelectionPlugin — Live Demo</title>
<script>
window["sap-ui-config"] = {
    theme: "sap_horizon",
    libs: "sap.ui.table,sap.m",
    async: false,
    resourceRoots: {
        "plugin": "../src",
        "demo": "./"
    }
};
</script>
<script src="https://sdk.openui5.org/resources/sap-ui-core.js"></script>
<script>
sap.ui.require(["demo/app"]);
</script>
</head>
<body class="sapUiBody sapUiSizeCozy" id="body">
</body>

<script>
sap.ui.define("demo/app", [
    "sap/m/App",
    "sap/m/Page",
    "sap/m/Toolbar",
    "sap/m/ToolbarSpacer",
    "sap/m/Title",
    "sap/m/Button",
    "sap/m/SearchField",
    "sap/m/MessageStrip",
    "sap/m/VBox",
    "sap/m/Text",
    "sap/m/Link",
    "sap/ui/table/Table",
    "sap/ui/table/Column",
    "sap/m/Label",
    "sap/ui/model/json/JSONModel",
    "sap/ui/model/Filter",
    "sap/ui/model/FilterOperator",
    "sap/ui/model/Sorter",
    "plugin/PersistSelectionPlugin"
], function (
    App, Page, Toolbar, ToolbarSpacer, Title,
    Button, SearchField, MessageStrip, VBox, Text, Link,
    Table, Column, Label,
    JSONModel, Filter, FilterOperator, Sorter,
    PersistSelectionPlugin
) {
    "use strict";

    const aData = [
        { id: 1,  name: "Alice Johnson",   dept: "Engineering",  role: "Senior Engineer",   salary: "$95,000",  active: "Yes" },
        { id: 2,  name: "Bob Martinez",    dept: "Product",      role: "Product Manager",   salary: "$88,000",  active: "Yes" },
        { id: 3,  name: "Charlie Wang",    dept: "Engineering",  role: "Tech Lead",         salary: "$110,000", active: "Yes" },
        { id: 4,  name: "Diana Patel",     dept: "Design",       role: "UX Designer",       salary: "$82,000",  active: "Yes" },
        { id: 5,  name: "Eve Thompson",    dept: "Engineering",  role: "Junior Engineer",   salary: "$72,000",  active: "No"  },
        { id: 6,  name: "Frank Lee",       dept: "Sales",        role: "Account Executive", salary: "$78,000",  active: "Yes" },
        { id: 7,  name: "Grace Kim",       dept: "HR",           role: "HR Manager",        salary: "$85,000",  active: "Yes" },
        { id: 8,  name: "Henry Brown",     dept: "Engineering",  role: "DevOps Engineer",   salary: "$92,000",  active: "Yes" },
        { id: 9,  name: "Iris Chen",       dept: "Product",      role: "Product Owner",     salary: "$91,000",  active: "Yes" },
        { id: 10, name: "Jack Wilson",     dept: "Design",       role: "UI Designer",       salary: "$79,000",  active: "No"  },
        { id: 11, name: "Karen Davis",     dept: "Engineering",  role: "QA Engineer",       salary: "$80,000",  active: "Yes" },
        { id: 12, name: "Liam Singh",      dept: "Sales",        role: "Sales Lead",        salary: "$95,000",  active: "Yes" },
        { id: 13, name: "Maya Robinson",   dept: "Engineering",  role: "Architect",         salary: "$125,000", active: "Yes" },
        { id: 14, name: "Nathan Gupta",    dept: "HR",           role: "Recruiter",         salary: "$68,000",  active: "Yes" },
        { id: 15, name: "Olivia Scott",    dept: "Product",      role: "BA",                salary: "$77,000",  active: "No"  }
    ];

    const oModel = new JSONModel({
        employees: aData,
        selectionInfo: "Select rows, then sort or filter to see selection persist.",
        selectionType: "None"  // None | Information | Success | Warning
    });

    // ── Status MessageStrip ──────────────────────────────────────────────────
    const oStrip = new MessageStrip({
        text: "{/selectionInfo}",
        type: "{/selectionType}",
        showIcon: true,
        showCloseButton: false
    }).addStyleClass("sapUiSmallMarginBottom");
    oStrip.setModel(oModel);

    // ── Plugin ───────────────────────────────────────────────────────────────
    const oPlugin = new PersistSelectionPlugin({
        selectionMode: "MultiToggle",
        selectionChange: function (oEvent) {
            const aPaths   = oEvent.getParameter("contextPaths");
            const sTrigger = oEvent.getParameter("trigger");

            if (aPaths.length === 0) {
                oModel.setProperty("/selectionInfo", "No rows selected.");
                oModel.setProperty("/selectionType", "None");
                return;
            }

            const aNames = aPaths.map(function (sPath) {
                return oModel.getProperty(sPath + "/name");
            });

            const bPreserved = sTrigger === "sortFilter";
            oModel.setProperty("/selectionType", bPreserved ? "Success" : "Information");
            oModel.setProperty("/selectionInfo",
                aPaths.length + " row(s) selected" +
                (bPreserved ? " — selection preserved after sort/filter ✓" : "") +
                ": " + aNames.join(", ")
            );
        }
    });

    // ── Table ────────────────────────────────────────────────────────────────
    const oTable = new Table("demoTable", {
        visibleRowCount: 10,
        selectionBehavior: "Row",
        dependents: [oPlugin],
        extension: [
            new Toolbar({
                content: [
                    new Title({ text: "Employee List" }),
                    new ToolbarSpacer(),
                    new SearchField({
                        placeholder: "Search by name…",
                        width: "14rem",
                        search: function (oEvent) {
                            const sVal = oEvent.getParameter("query");
                            const oBinding = oTable.getBinding("rows");
                            oBinding.filter(sVal
                                ? [new Filter("name", FilterOperator.Contains, sVal)]
                                : []
                            );
                        },
                        liveChange: function (oEvent) {
                            const sVal = oEvent.getParameter("newValue");
                            if (!sVal) {
                                oTable.getBinding("rows").filter([]);
                            }
                        }
                    }),
                    new Button({
                        text: "Sort Name ↕",
                        press: function () {
                            oTable._bNameAsc = !oTable._bNameAsc;
                            oTable.getBinding("rows").sort(new Sorter("name", oTable._bNameAsc));
                        }
                    }),
                    new Button({
                        text: "Sort Dept ↕",
                        press: function () {
                            oTable._bDeptAsc = !oTable._bDeptAsc;
                            oTable.getBinding("rows").sort(new Sorter("dept", oTable._bDeptAsc));
                        }
                    }),
                    new Button({
                        text: "Select All",
                        type: "Emphasized",
                        press: function () { oPlugin.selectAll(); }
                    }),
                    new Button({
                        text: "Clear",
                        press: function () { oPlugin.clearSelection(); }
                    })
                ]
            })
        ],
        columns: [
            new Column({ label: new Label({ text: "ID" }),         template: new Text({ text: "{id}" }),     width: "5rem",  sortProperty: "id" }),
            new Column({ label: new Label({ text: "Name" }),       template: new Text({ text: "{name}" }),   width: "14rem", sortProperty: "name" }),
            new Column({ label: new Label({ text: "Department" }), template: new Text({ text: "{dept}" }),   width: "11rem", sortProperty: "dept" }),
            new Column({ label: new Label({ text: "Role" }),       template: new Text({ text: "{role}" }),   width: "14rem" }),
            new Column({ label: new Label({ text: "Salary" }),     template: new Text({ text: "{salary}" }), width: "9rem",  hAlign: "Right" }),
            new Column({ label: new Label({ text: "Active" }),     template: new Text({ text: "{active}" }), width: "6rem" })
        ]
    });

    oTable.setModel(oModel);
    oTable.bindRows("/employees");

    // ── Page ─────────────────────────────────────────────────────────────────
    const oPage = new Page({
        title: "PersistSelectionPlugin — Live Demo",
        headerContent: [
            new Link({ text: "GitHub", href: "https://github.com/AbhilashBiradar/ui5-plugin-persist-selection", target: "_blank" }),
            new Link({ text: "npm",    href: "https://www.npmjs.com/package/ui5-plugin-persist-selection",      target: "_blank" })
        ],
        content: [
            new MessageStrip({
                text: "Select rows then sort or filter — selections are preserved by binding context path, not row index.",
                type: "Information",
                showIcon: true,
                showCloseButton: false
            }).addStyleClass("sapUiSmallMargin"),
            oStrip.addStyleClass("sapUiSmallMarginBegin sapUiSmallMarginEnd"),
            oTable
        ]
    });

    new App({ pages: [oPage] }).placeAt("body");
});
</script>
</html>
